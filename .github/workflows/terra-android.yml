name: Terra Android Build

# Baut eine installierbare Android-APK für die Terra-App und stellt sie
# als Release-Download bereit (direkt auf dem Handy installierbar).

on:
  push:
    branches:
      - main
      - claude/terra-habit-ecosystem-932x4q
    paths:
      - "terra/**"
      - ".github/workflows/terra-android.yml"
  workflow_dispatch: {}

# Für das Anlegen/Aktualisieren des Release nötig.
permissions:
  contents: write

concurrency:
  group: terra-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terra

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Java (JDK 17) einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          # Neueste stabile Version: Das Android-Scaffolding nutzt Gradle 9.1
          # und AGP 9.0.1, was nur von einer aktuellen Flutter-Version
          # unterstützt wird. Der Code selbst nutzt Color.withValues (>= 3.27).
          channel: stable
          cache: true

      - name: Abhängigkeiten holen
        run: flutter pub get

      - name: Statische Analyse
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Release-APK bauen (universal, installierbar)
        # Build-Nummer = Run-Nummer: So kann die installierte App per
        # latest.json erkennen, ob ein neuerer Build verfügbar ist.
        run: >-
          flutter build apk --release
          --build-name=1.0.${{ github.run_number }}
          --build-number=${{ github.run_number }}

      - name: APK + Update-Metadaten vorbereiten
        run: |
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/terra-release.apk
          cat > ../dist/latest.json <<EOF
          {
            "version": "1.0.${{ github.run_number }}",
            "buildNumber": ${{ github.run_number }},
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/terra-latest/terra-release.apk",
            "notes": "Automatischer Build aus Commit ${{ github.sha }}."
          }
          EOF
          ls -lh ../dist
          cat ../dist/latest.json

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: terra-release-apk
          path: dist/terra-release.apk
          if-no-files-found: error

      - name: Als Release-Download veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: terra-latest
          name: "Nova – neuester Android-Build"
          body: |
            Installierbare APK von **Nova** (universal, mit Debug-Key signiert).
            Version 1.0.${{ github.run_number }}

            **Installation auf dem Handy:**
            1. Diese Seite auf dem Handy öffnen und `terra-release.apk` herunterladen.
            2. Beim Öffnen der Datei „Installieren aus unbekannten Quellen“ für den Browser erlauben.
            3. Installieren – fertig.

            Ab dieser Version meldet sich die App künftig selbst, wenn ein
            neuer Build verfügbar ist.

            Automatisch gebaut aus Commit ${{ github.sha }}.
          prerelease: true
          make_latest: false
          files: |
            dist/terra-release.apk
            dist/latest.json
