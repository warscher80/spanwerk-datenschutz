name: APK bauen

on:
  push:
    branches: [ "**" ]
    paths:
      - "lib/**"
      - "android/**"
      - "pubspec.yaml"
      - "test/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Abhängigkeiten holen
        run: flutter pub get

      # Statische Pruefung. Lief bisher nicht mit, obwohl sie Fehler findet,
      # die kein Test abdeckt (ungenutzte Importe, tote Zweige, riskante
      # Null-Zugriffe).
      - name: Statische Analyse
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Release-APK bauen
        run: flutter build apk --release

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: footy-predict-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
