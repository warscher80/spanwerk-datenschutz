name: APK bauen

on:
  push:
    branches: [ "**" ]
    paths:
      - "lib/**"
      - "android/**"
      - "pubspec.yaml"
      - "test/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write   # fuer das Release-Asset mit dem fertigen APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: JDK 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Abhängigkeiten holen
        run: flutter pub get

      # Statische Pruefung. Lief bisher nicht mit, obwohl sie Fehler findet,
      # die kein Test abdeckt (ungenutzte Importe, tote Zweige, riskante
      # Null-Zugriffe).
      - name: Statische Analyse
        run: flutter analyze

      - name: Tests
        run: flutter test

      # Ohne festen Schluessel signiert Gradle mit dem Debug-Schluessel. Auf
      # einem Runner wird der bei JEDEM Lauf neu erzeugt - jedes APK haette
      # eine andere Signatur, und Android verweigert die Installation ueber
      # eine bestehende App ("App nicht installiert"). Der Nutzer muesste vor
      # jedem Update deinstallieren und verloere die gelernten Elo-Daten.
      #
      # Die erzeugten Dateien sind in .gitignore ausgeschlossen und werden
      # nicht committet.
      - name: Signaturschluessel einrichten (falls hinterlegt)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Kein Signaturschluessel hinterlegt - es wird mit dem Debug-Schluessel signiert."
            echo "::warning::Solche APKs lassen sich nicht ueber eine anders signierte Installation legen."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
          echo "Fester Signaturschluessel eingerichtet."

      - name: Release-APK bauen
        run: flutter build apk --release

      - name: Signatur des APK protokollieren
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          SIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner 2>/dev/null | sort | tail -1)
          if [ -n "$SIGNER" ]; then
            "$SIGNER" verify --print-certs "$APK" | grep -i "signer #1 certificate SHA-256" || true
          else
            echo "apksigner nicht gefunden - Signatur nicht geprueft."
          fi

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v7
        with:
          name: footy-predict-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Vorberechnetes Modell. Ein frisch installiertes Geraet muesste sonst je
      # Liga zwei Saisons nachlernen - bei der Bundesliga 68 Spieltage. Mit der
      # fertigen Datei ist es ein einziger Download, und alle Geraete starten
      # vom identischen Stand.
      #
      # Der Generator nutzt bewusst dieselbe Lernlogik wie die App (deshalb
      # laeuft er im Flutter-Test-Umfeld), sonst waere "ueberall derselbe
      # Stand" eine Behauptung statt einer Eigenschaft.
      #
      # continue-on-error: eine Drosselung der Datenquelle darf den Build nicht
      # kippen - dann bleibt eben das Modell des letzten Laufs bestehen.
      - name: Vorberechnetes Modell erzeugen
        if: github.ref_name == 'claude/football-betting-apk-m9fb1c'
        continue-on-error: true
        timeout-minutes: 40
        run: flutter test test/werkzeuge/modell_erzeugen.dart

      # Zusaetzlich als Release bereitstellen. Ein Artefakt laesst sich nur
      # angemeldet und nur als ZIP herunterladen - am Handy unbrauchbar. Ein
      # Release-Asset hat dagegen eine feste, direkt anklickbare Adresse, die
      # ueber alle Versionen gleich bleibt.
      - name: APK als Release bereitstellen
        if: github.ref_name == 'claude/football-betting-apk-m9fb1c'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          cp build/app/outputs/flutter-apk/app-release.apk KickProphet.apk
          # Modell nur mitliefern, wenn es erzeugt werden konnte.
          DATEIEN="KickProphet.apk"
          if [ -s build/modell.json ]; then
            cp build/modell.json modell.json
            DATEIEN="$DATEIEN modell.json"
            echo "Modell: $(wc -c < modell.json) B"
          else
            echo "::warning::Kein modell.json erzeugt - das Release behaelt das bisherige."
          fi
          if gh release view kickprophet-latest >/dev/null 2>&1; then
            gh release upload kickprophet-latest $DATEIEN --clobber
            gh release edit kickprophet-latest \
              --notes "KickProphet ${VERSION} · Build ${{ github.run_number }} · Commit ${GITHUB_SHA::7}"
          else
            gh release create kickprophet-latest $DATEIEN \
              --title "KickProphet – aktueller Build" \
              --notes "KickProphet ${VERSION} · Build ${{ github.run_number }} · Commit ${GITHUB_SHA::7}"
          fi
          echo "Direktlink: https://github.com/${GITHUB_REPOSITORY}/releases/download/kickprophet-latest/KickProphet.apk"
