name: Web-App veröffentlichen

on:
  push:
    branches: [ "claude/football-betting-apk-m9fb1c" ]
    paths:
      - "lib/**"
      - "web/**"
      - "pubspec.yaml"
      - "index.html"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Abhängigkeiten
        run: flutter pub get

      - name: Web bauen
        run: flutter build web --release --base-href /spanwerk-datenschutz/app/

      - name: Seite zusammenstellen (Datenschutz bleibt im Root)
        run: |
          mkdir -p site/app
          cp -r build/web/* site/app/
          cp index.html site/index.html

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
