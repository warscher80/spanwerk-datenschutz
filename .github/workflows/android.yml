name: Apps bauen (Android + Windows)

# Baut die installierbare Android-APK und das Windows-Programm in der Cloud
# und stellt beide als Download bereit (Release "app-latest").

on:
  push:
    branches:
      - claude/metalwork-estimation-app-9ez1ks
      - main
    paths:
      - "index.html"
      - "datenschutz.html"
      - "assets/**"
      - "android/**"
      - "scripts/**"
      - "desktop/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}   # erlaubt manuelles Starten per Knopf

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Versionsinfo erzeugen
        run: |
          BUILD=${{ github.run_number }}
          VERSION="1.0.${BUILD}"
          DATUM=$(date +%Y-%m-%d)
          # In die App eingebettetes Script (App liest window.PSBUILD ohne fetch)
          echo "window.PSBUILD = {\"build\": ${BUILD}, \"version\": \"${VERSION}\", \"datum\": \"${DATUM}\"};" > assets/build-info.js
          # Info-Datei fürs Release
          echo "{\"build\": ${BUILD}, \"version\": \"${VERSION}\", \"datum\": \"${DATUM}\"}" > version.json
          echo "VCODE=${BUILD}" >> $GITHUB_ENV
          echo "VNAME=${VERSION}" >> $GITHUB_ENV
          cat assets/build-info.js

      - name: Web-Dateien synchronisieren
        run: npm run sync

      - name: APK bauen (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Pvcode=${{ env.VCODE }} -Pvname=${{ env.VNAME }}

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk preisschmiede.apk

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: preisschmiede-apk
          path: preisschmiede.apk

      - name: Veraltete APK aus dem Release entfernen
        run: gh release delete-asset app-latest preisschmiede.apk --yes || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: APK als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Preisschmiede – aktuelle App
          body: |
            Preisschmiede, Version 1.0.${{ github.run_number }}.

            📱 Android: preisschmiede.apk herunterladen und öffnen. Falls
            "Installation blockiert": Installation aus unbekannten Quellen für den
            Browser erlauben. Updates installieren sich ohne Datenverlust.

            💻 Windows: preisschmiede-setup.exe herunterladen und ausführen.
            Eventuelle SmartScreen-Warnung mit "Weitere Informationen" → "Trotzdem
            ausführen" bestätigen (unsignierter Build).
          files: |
            preisschmiede.apk
            version.json
          prerelease: true

  desktop:
    name: Windows-Programm bauen
    needs: build
    runs-on: windows-latest
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Versionsinfo + Web-Dateien bereitstellen
        shell: bash
        run: |
          BUILD=${{ github.run_number }}
          echo "window.PSBUILD = {\"build\": ${BUILD}, \"version\": \"1.0.${BUILD}\", \"datum\": \"$(date +%Y-%m-%d)\"};" > assets/build-info.js
          mkdir -p desktop/app
          cp -r index.html datenschutz.html assets desktop/app/

      - name: Abhängigkeiten installieren
        run: npm install
        working-directory: desktop

      - name: Windows-Programm bauen (.exe)
        run: npm run dist
        working-directory: desktop

      - name: .exe ins Release laden
        shell: bash
        run: gh release upload app-latest desktop/dist/preisschmiede-setup.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
