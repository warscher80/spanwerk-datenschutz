<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Standort-Test</title>
<style>
  :root{color-scheme:dark light}
  body{margin:0;padding:18px;background:#101418;color:#e9eef3;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.45}
  h1{font-size:22px;margin:0 0 6px}
  p.sub{color:#9aa8b6;margin:0 0 18px;font-size:14px}
  button{width:100%;border:0;border-radius:14px;padding:22px 16px;font-size:21px;font-weight:800;
    background:#e2001a;color:#fff;margin-bottom:12px}
  button.zweit{background:#243040;color:#e9eef3;font-size:16px;padding:16px}
  .kasten{border:1px solid #2b3743;border-radius:12px;padding:14px;margin-bottom:12px;background:#171d24}
  .gross{font-size:24px;font-weight:800;line-height:1.2}
  .ok{color:#2fc27a} .bad{color:#ff6b6b} .warte{color:#ffbf3d}
  pre{white-space:pre-wrap;word-break:break-word;font-size:12.5px;line-height:1.5;color:#c8d3de;
    background:#0c1116;border:1px solid #2b3743;border-radius:10px;padding:10px;margin:10px 0 0;
    -webkit-user-select:text;user-select:text}
</style>
</head>
<body>
<h1>Standort-Test</h1>
<p class="sub">Diese Seite macht nur eines: den Standort abfragen und zeigen, was das Handy
antwortet. Keine App, kein Zwischenspeicher.</p>

<button id="knopf">STANDORT ABFRAGEN</button>

<div class="kasten">
  <div class="gross warte" id="ergebnis">Noch nichts abgefragt</div>
  <div id="details" style="margin-top:8px;color:#9aa8b6;font-size:14px"></div>
</div>

<button class="zweit" id="kopieren">Alles kopieren</button>

<div class="kasten">
  <div style="font-size:12px;color:#9aa8b6;text-transform:uppercase;letter-spacing:.6px">Umgebung</div>
  <pre id="umgebung"></pre>
</div>

<script>
var protokoll = [];
function log(t){
  var z = new Date().toLocaleTimeString('de-DE');
  protokoll.push(z + '  ' + t);
  umgebungZeigen();
}
function umgebungZeigen(){
  var z = [];
  z.push('Adresse: ' + location.href);
  z.push('Sicherer Kontext (https): ' + (window.isSecureContext ? 'ja' : 'NEIN — dann geht Standort nie'));
  z.push('Ortung im Browser vorhanden: ' + (navigator.geolocation ? 'ja' : 'NEIN'));
  z.push('Vom Home-Bildschirm gestartet: ' + (window.navigator.standalone === true ? 'ja' : 'nein'));
  z.push('Service Worker aktiv: ' + (('serviceWorker' in navigator) && navigator.serviceWorker.controller ? 'ja' : 'nein'));
  z.push('Browser: ' + navigator.userAgent);
  z.push('');
  z.push(protokoll.join('\n') || '(noch keine Meldungen)');
  document.getElementById('umgebung').textContent = z.join('\n');
}

// Freigabe-Zustand abfragen, falls der Browser das kann (Safari wirft hier teils sofort)
try {
  if (navigator.permissions && navigator.permissions.query) {
    var v = navigator.permissions.query({ name: 'geolocation' });
    if (v && v.then) v.then(function(r){ log('Freigabe-Zustand laut Browser: ' + r.state); })
                      .catch(function(e){ log('Freigabe-Zustand nicht abfragbar'); });
  } else { log('Freigabe-Abfrage vom Browser nicht angeboten'); }
} catch (e) { log('Freigabe-Abfrage wirft sofort: ' + (e && e.message)); }

var FEHLER = { 1: 'ABGELEHNT — das Handy erlaubt der Seite den Standort nicht',
               2: 'NICHT VERFÜGBAR — Ortung aus oder kein Empfang',
               3: 'ZEITÜBERSCHREITUNG — keine Antwort in 30 Sekunden' };

document.getElementById('knopf').onclick = function(){
  var erg = document.getElementById('ergebnis'), det = document.getElementById('details');
  erg.className = 'gross warte';
  erg.textContent = 'Frage an … (bitte ERLAUBEN antippen)';
  det.textContent = 'Wenn keine Frage erscheint, ist die Freigabe schon vergeben oder gesperrt.';
  log('Abfrage gestartet');
  var start = Date.now();
  navigator.geolocation.getCurrentPosition(function(p){
    var s = Math.round((Date.now() - start) / 100) / 10;
    erg.className = 'gross ok';
    erg.textContent = 'GEHT! Standort da';
    det.innerHTML = 'Breite: <b>' + p.coords.latitude.toFixed(6) + '</b><br>' +
                    'Länge: <b>' + p.coords.longitude.toFixed(6) + '</b><br>' +
                    'Genauigkeit: <b>±' + Math.round(p.coords.accuracy) + ' m</b><br>' +
                    'Gedauert: ' + s + ' s';
    log('ERFOLG nach ' + s + ' s, Genauigkeit ±' + Math.round(p.coords.accuracy) + ' m');
  }, function(e){
    erg.className = 'gross bad';
    erg.textContent = 'Fehler ' + e.code;
    det.textContent = (FEHLER[e.code] || 'Unbekannter Fehler') + '\n\nMeldung: ' + (e.message || '(keine)');
    log('FEHLER ' + e.code + ': ' + (e.message || ''));
  }, { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 });
};

document.getElementById('kopieren').onclick = function(){
  var t = document.getElementById('ergebnis').textContent + '\n' +
          document.getElementById('details').textContent + '\n\n' +
          document.getElementById('umgebung').textContent;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(function(){ alert('Kopiert — bitte einfügen und schicken.'); },
                                          function(){ alert('Kopieren ging nicht — Text markieren und kopieren.'); });
  } else { alert('Kopieren ging nicht — Text markieren und kopieren.'); }
};

umgebungZeigen();
</script>
</body>
</html>
