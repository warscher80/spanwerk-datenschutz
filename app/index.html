  <title>KickProphet – Fußball-Prognosen &amp; Spielanalysen</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Ladehintergrund in Markenfarbe – kein weißes Aufblitzen vor dem Start. */
    html, body { margin: 0; padding: 0; background-color: #0A1512; }

    /* ===== NIVOX Blitz-Intro ===== */
    #nivox-intro{
      position:fixed; inset:0; z-index:2147483647;
      display:flex; align-items:center; justify-content:center;
      background:#04060a; overflow:hidden;
      opacity:1; transition:opacity .55s ease;
      /* leichte Rest-Aufhellung vom Blitz */
      will-change:opacity;
    }
    #nivox-intro.done{ opacity:0; pointer-events:none; }

    /* kurzer Vollbild-Aufhell-Blitz */
    #nivox-intro .nx-flash{
      position:absolute; inset:0; pointer-events:none; opacity:0;
      background:radial-gradient(120% 90% at 50% 45%, rgba(210,238,255,.9), rgba(70,150,255,.25) 45%, transparent 70%);
      mix-blend-mode:screen;
    }
    /* Bodenreflexion / Lichtsaum unten */
    #nivox-intro .nx-floor{
      position:absolute; left:0; right:0; bottom:0; height:34%;
      background:radial-gradient(80% 120% at 50% 130%, rgba(56,150,255,.22), transparent 60%);
      opacity:0; pointer-events:none;
    }

    /* Blitz-SVG deckt den ganzen Screen */
    #nivox-intro .nx-bolt{
      position:absolute; inset:0; width:100%; height:100%;
      pointer-events:none; opacity:0;
      /* Der Glow kommt aus dem SVG-Filter (#nxGlow) – zuverlässig überall. */
    }
    #nivox-intro .nx-bolt path{
      fill:none; stroke-linecap:round; stroke-linejoin:round;
      stroke-dasharray:2600; stroke-dashoffset:2600;
    }

    /* Logo */
    #nivox-intro .nx-logo{
      max-width:82vw; max-height:58vh; width:auto; height:auto;
      object-fit:contain; opacity:0; transform:scale(.97);
      filter:drop-shadow(0 0 0 rgba(70,160,255,0));
      will-change:opacity, transform, filter;
    }
    #nivox-intro .nx-logo-wrap{
      position:relative; display:flex; flex-direction:column; align-items:center;
    }
    /* NIVOX-Wortmarke als Vektor (Marken-Stil): metallisches Silber mit
       blauem Akzent + Tagline. Wird genutzt, solange keine nivox.png beiliegt. */
    #nivox-intro .nx-text{ display:none; text-align:center; }
    #nivox-intro .nx-word{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Arial Black",sans-serif;
      font-weight:800; letter-spacing:.16em; line-height:1;
      font-size:clamp(40px,11vw,104px);
      background:linear-gradient(180deg,#ffffff 0%,#dce8f4 42%,#94aec4 56%,#f2f8ff 100%);
      -webkit-background-clip:text; background-clip:text; color:transparent;
      filter:drop-shadow(0 0 20px rgba(90,170,255,.45));
    }
    #nivox-intro .nx-word span{
      background:linear-gradient(180deg,#d6efff 0%,#3a9dff 55%,#1e78ff 100%);
      -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    #nivox-intro .nx-tag{
      margin-top:.62em; padding-left:.5em;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      font-weight:700; letter-spacing:.5em; font-size:clamp(9px,2.3vw,15px);
      color:#a9c9e8;
    }
    #nivox-intro.noimg .nx-logo{ display:none; }
    #nivox-intro.noimg .nx-text{ display:block; }

    /* ---- Ablauf ---- */
    #nivox-intro.play .nx-bolt{ animation:nxBolt .5s ease-out .38s both; }
    #nivox-intro.play .nx-bolt path{ animation:nxStrike .16s cubic-bezier(.2,.8,.2,1) .38s both; }
    #nivox-intro.play .nx-flash{ animation:nxFlash .34s ease-out .40s both; }
    #nivox-intro.play .nx-floor{ animation:nxFloor 1.1s ease-out .42s both; }
    #nivox-intro.play .nx-logo{ animation:nxLogoIn 1.15s cubic-bezier(.2,.7,.2,1) .42s both; }
    #nivox-intro.play .nx-text{ animation:nxLogoIn 1.15s cubic-bezier(.2,.7,.2,1) .42s both; }

    @keyframes nxStrike{ from{ stroke-dashoffset:2600; } to{ stroke-dashoffset:0; } }
    @keyframes nxBolt{
      0%{ opacity:0; } 12%{ opacity:1; } 60%{ opacity:.9; } 100%{ opacity:0; }
    }
    @keyframes nxFlash{
      0%{ opacity:0; } 22%{ opacity:.95; } 100%{ opacity:0; }
    }
    @keyframes nxFloor{
      0%{ opacity:0; } 25%{ opacity:1; } 100%{ opacity:.35; }
    }
    @keyframes nxLogoIn{
      0%{ opacity:0; transform:scale(.97); filter:drop-shadow(0 0 0 rgba(70,160,255,0)) brightness(2.2); }
      10%{ opacity:1; filter:drop-shadow(0 0 26px rgba(90,180,255,.9)) brightness(1.9); }
      45%{ filter:drop-shadow(0 0 20px rgba(80,170,255,.6)) brightness(1.12); }
      100%{ opacity:1; transform:scale(1); filter:drop-shadow(0 0 10px rgba(70,150,255,.32)) brightness(1); }
    }
    @keyframes nxSweep{
      0%{ left:-60%; opacity:0; } 15%{ opacity:1; } 100%{ left:120%; opacity:0; }
    }

    /* Barrierefrei: keine Bewegung -> Logo einfach kurz sauber einblenden */
    @media (prefers-reduced-motion: reduce){
      #nivox-intro .nx-bolt, #nivox-intro .nx-flash, #nivox-intro .nx-floor, #nivox-intro .nx-logo-wrap::after{ display:none !important; animation:none !important; }
      #nivox-intro.play .nx-logo, #nivox-intro.play .nx-text{ animation:nxFadeOnly .35s ease-out both; }
      @keyframes nxFadeOnly{ from{opacity:0;} to{opacity:1;} }
    }
  </style>
</head>
<body>
  <!-- NIVOX Blitz-Intro (liegt über der App, blendet nach dem Start weich aus) -->
  <div id="nivox-intro" aria-hidden="true">
    <div class="nx-floor"></div>
    <svg class="nx-bolt" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="nxGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#bfe6ff"/>
          <stop offset="0.5" stop-color="#5aa8ff"/>
          <stop offset="1" stop-color="#eaf6ff"/>
        </linearGradient>
        <filter id="nxGlow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="7" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <!-- weicher, breiter Schein (SVG-Filter, nur Verstärkung) -->
      <g filter="url(#nxGlow)" opacity="0.6">
        <path d="M150,-40 L440,150 L360,235 L640,400 L540,475 L820,660"
              stroke="#2f7fff" stroke-width="12"/>
      </g>
      <!-- scharfer heller Kern (ohne Filter -> immer sichtbar) -->
      <path d="M150,-40 L440,150 L360,235 L640,400 L540,475 L820,660"
            stroke="url(#nxGrad)" stroke-width="4"/>
      <path d="M150,-40 L440,150 L360,235 L640,400 L540,475 L820,660"
            stroke="#ffffff" stroke-width="1.6" opacity="0.9"/>
      <!-- Verzweigungen -->
      <path d="M440,150 L540,132 L488,205" stroke="#bfe6ff" stroke-width="3"/>
      <path d="M640,400 L726,410 L676,470" stroke="#bfe6ff" stroke-width="2.6"/>
    </svg>
    <div class="nx-logo-wrap">
      <img class="nx-logo" src="nivox.png" alt="NIVOX"
           onerror="document.getElementById('nivox-intro').classList.add('noimg')"/>
      <div class="nx-text">
        <div class="nx-word">NI<span>V</span>OX</div>
        <div class="nx-tag">APPS · WEB · SOFTWARE</div>
      </div>
    </div>
    <div class="nx-flash"></div>
  </div>

  <script>
    (function(){
      var intro = document.getElementById('nivox-intro');
      if(!intro){ return; }
      try{
        // Flutter übernimmt beim Start den <body> und würde das Overlay
        // entfernen. Deshalb an <html> hängen – bleibt so bis zum sauberen
        // Ausblenden liegen (fixed deckt trotzdem den ganzen Viewport).
        document.documentElement.appendChild(intro);
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        // Animation starten (nächster Frame, damit die Keyframes sauber greifen).
        requestAnimationFrame(function(){ intro.classList.add('play'); });

        var flutterReady = false, minDone = false, hidden = false;
        function hide(){
          if(hidden){ return; } hidden = true;
          intro.classList.add('done');
          setTimeout(function(){ if(intro.parentNode){ intro.parentNode.removeChild(intro); } }, 650);
        }
        function maybe(){ if(flutterReady && minDone){ hide(); } }
        // Mindest-Dauer des Intros (kürzer bei reduzierter Bewegung).
        setTimeout(function(){ minDone = true; maybe(); }, reduce ? 500 : 1500);
        // Ausblenden erst, wenn Flutter den ersten Frame gezeichnet hat.
        window.addEventListener('flutter-first-frame', function(){ flutterReady = true; maybe(); }, {once:true});
        // Sicherheitsnetz: nie länger als ~4,2 s stehen bleiben.
        setTimeout(hide, 4200);
      }catch(e){
        // Bei irgendeinem Fehler das Intro sofort entfernen – nie die App blockieren.
        if(intro.parentNode){ intro.parentNode.removeChild(intro); }
      }
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
