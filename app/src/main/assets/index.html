<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kickbet</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">⚽ Kickbet</div>
  <div class="balance">
    <span class="balance-label">Guthaben</span>
    <span id="balance">0</span><span class="coin"> Coins</span>
  </div>
</header>

<div class="playmoney-banner">Spielgeld · keine echten Einsätze · ab 18 · nur zur Unterhaltung</div>

<nav class="tabs">
  <button class="tab active" data-tab="matches">Spiele</button>
  <button class="tab" data-tab="slip">Tippschein <span id="slipCount" class="badge">0</span></button>
  <button class="tab" data-tab="history">Verlauf</button>
</nav>

<main>
  <section id="tab-matches" class="tabpanel active"></section>

  <section id="tab-slip" class="tabpanel">
    <div id="slipList"></div>
    <div id="slipEmpty" class="empty">Noch keine Tipps gewählt. Tippe auf eine Quote bei den Spielen.</div>
    <div id="slipFooter" class="slip-footer hidden">
      <label class="stake-row">
        <span>Einsatz</span>
        <input id="stake" type="number" min="1" step="1" value="50" inputmode="numeric">
        <span class="coin-sm">Coins</span>
      </label>
      <div class="quick-stakes">
        <button data-stake="10">10</button>
        <button data-stake="50">50</button>
        <button data-stake="100">100</button>
        <button data-stake="max">Max</button>
      </div>
      <div class="payout-row">
        <span>Gesamtquote</span><strong id="totalOdds">1.00</strong>
      </div>
      <div class="payout-row big">
        <span>Möglicher Gewinn</span><strong id="potWin">0</strong>
      </div>
      <button id="placeBet" class="btn-primary">Wette platzieren</button>
    </div>
  </section>

  <section id="tab-history" class="tabpanel">
    <div id="historyList"></div>
    <div id="historyEmpty" class="empty">Noch keine Wetten. Viel Erfolg beim ersten Tipp! 🍀</div>
    <button id="resetAccount" class="btn-ghost">Konto zurücksetzen (1.000 Coins)</button>
  </section>
</main>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
