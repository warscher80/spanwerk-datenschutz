name: terra
description: "Terra – ein Habit-Tracker als lebendiges, sich selbst erhaltendes Mikro-Ökosystem im Glas."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Lokale DB (SQLite)
  drift: ^2.18.0
  sqlite3: ">=2.4.0 <4.0.0" # von drift auf die passende 3.x-Version aufgelöst
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Navigation
  go_router: ^14.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Drift Codegen
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
