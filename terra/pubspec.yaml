name: terra
description: "Nova – ein kosmisches Merge-Aufbauspiel. Verschmilz Sternenstaub zu Planeten, Sternen und ganzen Galaxien."
publish_to: "none"
version: 0.2.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Lokales Speichern von Spielstand & Sammlung
  path_provider: ^2.1.3

  # Automatische Update-Prüfung (sideloadete APK via GitHub-Release)
  http: ^1.2.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
