include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
  errors:
    # Drift-Codegen erzeugt manchmal Warnungen, die den Build nicht blockieren sollen.
    invalid_annotation_target: ignore

linter:
  rules:
    prefer_const_constructors: true
    prefer_final_locals: true
    avoid_print: true
