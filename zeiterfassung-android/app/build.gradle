plugins {
    id 'com.android.application'
}

android {
    namespace 'at.nachkalkulation.zeiterfassung'
    compileSdk 34

    defaultConfig {
        applicationId "at.nachkalkulation.zeiterfassung"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    signingConfigs {
        release {
            storeFile file('zeiterfassung-release.jks')
            storePassword 'zeiterfassung'
            keyAlias 'zeit'
            keyPassword 'zeiterfassung'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
