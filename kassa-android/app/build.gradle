plugins {
    id 'com.android.application'
}

android {
    namespace 'at.spanwerk.sommerfestkassa'
    compileSdk 34

    defaultConfig {
        applicationId "at.spanwerk.sommerfestkassa"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file('spanwerk-release.jks')
            storePassword 'spanwerk'
            keyAlias 'spanwerk'
            keyPassword 'spanwerk'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
