# Preisschmiede – statische Auslieferung (unprivilegiertes nginx, Port 8080)
# Sicherheits-Header + Healthcheck + kein Directory-Listing.
# HTTP->HTTPS-Weiterleitung erfolgt an der TLS-Terminierung (Reverse Proxy /
# Load Balancer / managed Hosting), nicht in diesem Container.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    autoindex off;
    server_tokens off;

    # ---- Sicherheits-Header ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
    # HSTS wirkt nur hinter HTTPS; an der TLS-Terminierung ggf. zusätzlich setzen.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Strenge CSP: alles lokal, keine externen Quellen. Inline-Styles (Attribute)
    # werden von der App genutzt -> 'unsafe-inline' nur für style-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'" always;

    # ---- Healthcheck ----
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- statische Assets: langlebiges Caching (Dateinamen sind stabil) ----
    location /assets/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    # ---- SPA-Fallback auf index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sensible Dateien niemals ausliefern
    location ~ /\.(?!well-known) { deny all; }
}
